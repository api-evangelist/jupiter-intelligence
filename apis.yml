aid: jupiter-intelligence
name: Jupiter Intelligence
description: >-
  Jupiter Intelligence is a climate risk analytics company founded in 2017 and
  headquartered in San Mateo, California. Built by climate scientists, Jupiter
  delivers decision-grade physical and extreme-weather risk intelligence to
  banks, insurers, asset managers, corporates, and public-sector institutions.
  Its flagship platform, ClimateScore Global, translates physical climate
  exposure across multiple perils, scenarios, and time horizons out to 2100 into
  finance-linked, audit-ready metrics that support underwriting, capital
  planning, portfolio management, and regulatory disclosure. Products include
  ClimateScore Global, RiskSignal, Adaptation Hub, Entity Modeling, MetricEngine,
  Compliance Hub, and the MRM Accelerator. Jupiter is delivered as a SaaS
  application, an enterprise API, and tailored analytics support. It is SOC 2
  Type 2 certified and backed by investors including DCVC.
